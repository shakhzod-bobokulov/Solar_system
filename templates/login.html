<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tizimga kirish</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-body" data-title-key="login.title">
  <div class="auth-controls">
    {% include "_controls.html" %}
  </div>

  <main class="auth-card">
    <span class="topbar__logo auth-card__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </span>
    <h1 id="authTitle">Tizimga kirish</h1>
    <p class="auth-card__sub" id="authSub"></p>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" class="tabs__btn is-active" data-mode="login" role="tab" data-i18n="tab.login">Kirish</button>
      <button type="button" class="tabs__btn" data-mode="register" role="tab" data-i18n="tab.register">Ro'yxatdan o'tish</button>
    </div>

    <form id="loginForm" class="form" novalidate>
      <label class="field" data-field="username">
        <span id="usernameLabel">Login</span>
        <input type="text" id="username" name="username" autocomplete="username" autofocus />
      </label>
      <label class="field" data-field="email" hidden>
        <span data-i18n="field.email">Email</span>
        <input type="email" id="email" name="email" autocomplete="email" />
      </label>
      <label class="field" data-field="code" hidden>
        <span data-i18n="field.code">Tasdiqlash kodi</span>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="field__code" placeholder="000000" />
      </label>
      <label class="field" data-field="password">
        <span id="passwordLabel" data-i18n="login.password">Parol</span>
        <input type="password" id="password" name="password" autocomplete="current-password" />
      </label>
      <label class="field" data-field="confirm" hidden>
        <span data-i18n="reg.confirm">Parolni takrorlang</span>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" />
      </label>
      <p class="form__hint" id="regHint" data-i18n="reg.hint" hidden>Login: 3–30 belgi. Parol: kamida 8 belgi.</p>
      <label class="check" id="showPasswordWrap">
        <input type="checkbox" id="showPassword" />
        <span data-i18n="login.show">Parolni ko'rsatish</span>
      </label>
      <div id="formInfo" class="form__info" role="status" hidden></div>
      <div id="loginError" class="form__error" role="alert" hidden></div>
      <button type="submit" id="loginSubmit" class="btn btn--primary btn--block">Kirish</button>

      <div class="form__links">
        <button type="button" class="linkbtn" id="forgotLink" data-i18n="forgot.link">Parolni unutdingizmi?</button>
        <button type="button" class="linkbtn" id="resendBtn" hidden></button>
        <button type="button" class="linkbtn" id="backLink" data-i18n="back" hidden>Orqaga</button>
      </div>
    </form>

    <div id="guestBlock">
      <p class="auth-card__note" data-i18n="login.optional">Kirish ixtiyoriy: hisobsiz ham panellarni tahlil qilish mumkin.</p>
      <a class="btn btn--block auth-card__guest" href="/" data-i18n="login.guest">Kirmasdan davom etish</a>
    </div>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
